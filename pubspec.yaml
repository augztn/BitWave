name: bitwave
description: A cross-platform Telegram-powered personal music player.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  audio_service: ^0.18.17
  just_audio: ^0.9.46
  just_audio_media_kit: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

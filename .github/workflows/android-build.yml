name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Android runner
        run: flutter create --platforms=android --project-name bitwave --org dev.bitwave .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: bitwave-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
